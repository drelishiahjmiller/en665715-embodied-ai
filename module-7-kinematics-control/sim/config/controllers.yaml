controller_manager:
  ros__parameters:
    update_rate: 50            # Hz
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:
    use_sim_time: true
    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]

    # Course robot geometry
    wheel_separation: 0.127    # 5 in, center to center
    wheel_radius: 0.03175      # 2.5 in diameter / 2

    # Its odometry is our REFERENCE: published on /diff_drive_controller/odom.
    # YOUR odometry node owns /odom and the odom -> base_link transform,
    # so the controller must not publish that transform too.
    odom_frame_id: odom
    base_frame_id: base_link
    position_feedback: true
    open_loop: false
    enable_odom_tf: false
    publish_rate: 50.0
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    use_stamped_vel: false     # plain geometry_msgs/Twist
    cmd_vel_timeout: 0.5       # stop if commands stop arriving

    linear.x.has_velocity_limits: true
    linear.x.max_velocity: 0.3
    linear.x.min_velocity: -0.3
    linear.x.has_acceleration_limits: true
    linear.x.max_acceleration: 0.5
    linear.x.min_acceleration: -0.5
    angular.z.has_velocity_limits: true
    angular.z.max_velocity: 1.5
    angular.z.min_velocity: -1.5
