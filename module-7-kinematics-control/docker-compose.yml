services:
  gazebo:
    build: ./docker
    container_name: m7-gazebo
    # Lets the micro-ROS Agent container share this container's memory
    ipc: shareable
    ports:
      # Browser desktop. 127.0.0.1 keeps it private to your computer.
      - "127.0.0.1:6080:6080"
      # The Pico sends micro-ROS traffic to your computer on UDP port 8888
      - "8888:8888/udp"
    extra_hosts:
      # Lets ROSA reach Ollama running on your computer (macOS and Windows)
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/workspace
    environment:
      - DISPLAY=:1
      - ROS_DOMAIN_ID=0
      - LIBGL_ALWAYS_SOFTWARE=1
      - QT_X11_NO_MITSHM=1
    shm_size: "1gb"

  micro-ros-agent:
    image: microros/micro-ros-agent:humble
    container_name: m7-micro-ros-agent
    # Share the Gazebo container's network and memory so the Pico's topics
    # appear in the same ROS 2 graph as the simulator and your nodes
    network_mode: "service:gazebo"
    ipc: "service:gazebo"
    environment:
      - ROS_DOMAIN_ID=0
    command: ["udp4", "--port", "8888", "-v4"]
    depends_on:
      - gazebo
    restart: unless-stopped
