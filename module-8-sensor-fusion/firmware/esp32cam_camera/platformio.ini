; PlatformIO project for the ESP32-CAM photo server (VS Code + PlatformIO IDE extension).
; The sketch stays in this folder, so it also still opens in the Arduino IDE.

[platformio]
src_dir = .
default_envs = esp32cam

[env:esp32cam]
; pioarduino: the community-maintained PlatformIO platform for Espressif's Arduino core 3
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32cam            ; AI Thinker ESP32-CAM (enables its 4 MB PSRAM)
framework = arduino
build_src_filter = +<*> -<.pio/> -<.vscode/>
monitor_speed = 115200
; The ESP32-CAM-MB wires RTS/DTR to RST/IO0: keep them released, or the serial
; monitor holds the ESP32 in reset and prints nothing.
monitor_rts = 0
monitor_dtr = 0
