# robot_localization EKF for the course robot: wheel odometry + BNO055 IMU.
#
# Each *_config list picks which values of a message the filter uses, in this order:
#   [ x,     y,      z,
#     roll,  pitch,  yaw,
#     vx,    vy,     vz,
#     vroll, vpitch, vyaw,
#     ax,    ay,     az ]
ekf_filter_node:
  ros__parameters:
    frequency: 50.0              # Hz, matches the 50 Hz sensors
    sensor_timeout: 0.1          # s without data before the filter predicts only
    two_d_mode: true             # flat floor: ignore z, roll, pitch
    publish_tf: true             # the EKF owns odom -> base_link
    publish_acceleration: false
    print_diagnostics: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom            # a smooth local frame; no GPS or map in this lab

    # Wheels: forward speed and turn rate (NOT pose: wheel pose drifts and is
    # computed from the same counts, so fusing it would count them twice)
    odom0: /wheel/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    # BNO055: heading (yaw) from its quaternion, and turn rate from its gyroscope
    imu0: /pico/imu/data
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 10
    imu0_differential: false
    imu0_relative: true          # the first IMU heading becomes 0, like the wheels' start
    imu0_remove_gravitational_acceleration: false   # the BNO055 already removed gravity
